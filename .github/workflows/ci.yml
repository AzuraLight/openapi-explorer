name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04 # Playwright 1.60 cannot install Chromium deps on ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run assets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:webview
      - run: npm run build
      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies -o openapi-explorer-${{ github.sha }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-explorer-vsix
          path: "*.vsix"
