name: Publish to Open VSX

# Publishes the exact VSIX attached to a GitHub release (no rebuild), so Open VSX and the
# release download are byte-identical. Runs when a release is published, or manually for a tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose VSIX to publish (e.g. v1.1.1)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download VSIX from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.vsix" --dir vsix
      - name: Publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }} # read by ovsx from the environment
        run: npx --yes ovsx@1.4.0 publish vsix/*.vsix
